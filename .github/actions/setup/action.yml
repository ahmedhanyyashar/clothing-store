name: Setup
description: Install Node.js, pnpm, the locked dependencies and the Prisma client

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # the client is generated, not committed, and typecheck, tests and build all import it
    - run: pnpm db:generate
      shell: bash
