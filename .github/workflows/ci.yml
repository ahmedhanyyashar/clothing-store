name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token: no job pushes, comments or publishes anything
permissions:
  contents: read

# a newer push to the same ref supersedes the run still in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Values for the throwaway database below. src/env.ts validates them at build
# and test time, so CI declares them itself. Nothing here is a real credential.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://root:password@localhost:5433/clothing_store_test
  SMTP_URL: smtp://localhost:1025
  EMAIL_FROM: no-reply@clothing-store.example
  BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
  GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: ci-client-secret
  STRIPE_SECRET_KEY: sk_test_mock
  STRIPE_WEBHOOK_SECRET: whsec_test_secret
  STRIPE_API_URL: http://localhost:12111
  S3_BUCKET: clothing-store-test
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://localhost:4566
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      storage:
        image: floci/floci:2.4.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      mail:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: .reports/playwright/html
          retention-days: 7

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
