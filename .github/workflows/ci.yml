name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token: no job pushes, comments or publishes anything
permissions:
  contents: read

# a newer push to the same ref supersedes the run still in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Values for the throwaway database below. src/env.ts validates them at build
# and test time, so CI declares them itself. Nothing here is a real credential.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://root:password@localhost:5433/clothing_store_test
  SMTP_URL: smtp://localhost:1025
  EMAIL_FROM: no-reply@clothing-store.example

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
