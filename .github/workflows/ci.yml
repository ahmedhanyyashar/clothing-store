name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only token: no job pushes, comments or publishes anything
permissions:
  contents: read

# a newer push to the same ref supersedes the run still in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The environment for the throwaway services below comes from .env.test, which
# the setup action copies to .env.

jobs:
  # Text-only changes (Markdown and docs/) do not need the slow jobs. A job
  # skipped by its `if` counts as passed for the required checks, which a
  # workflow-level paths-ignore would not: those checks would never report and
  # a docs pull request could not merge. verify still runs, so Prettier checks
  # the Markdown.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # when the range cannot be read (a new branch, a force push), assume code
          if git diff --name-only "$BASE...$HEAD" > changed.txt 2>/dev/null; then
            if grep -qvE '\.md$|^docs/' changed.txt; then code=true; else code=false; fi
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: npm ci
        working-directory: infra
      - run: npm run typecheck
        working-directory: infra

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      storage:
        image: floci/floci:2.0.1
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:integration

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
      storage:
        image: floci/floci:2.0.1
        ports:
          - 4566:4566
      mail:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: .reports/playwright/html
          retention-days: 7

  # Informational for now: not one of the required checks. Accessibility and
  # best practices fail the job below a score; performance only warns, because
  # a shared runner's timings are noisy.
  lighthouse:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clothing_store_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U root -d clothing_store_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .reports/lighthouse
          retention-days: 7

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
