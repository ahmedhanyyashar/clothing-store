name: clothing-store

services:
  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clothing_store
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U root -d clothing_store",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # A separate container and volume, so wiping the test data can never touch
  # development data.
  database-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: clothing_store_test
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U root -d clothing_store_test",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches outgoing email. Read it at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A stand-in for the Stripe API, generated from Stripe's own OpenAPI spec, so
  # tests exercise the real request shapes without the network or an account.
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - "12111:12111"
    restart: unless-stopped

  # An S3-compatible stand-in for the product photo bucket. Create the bucket
  # with `pnpm storage:setup`.
  storage:
    image: floci/floci:2.4.0
    ports:
      - "4566:4566"
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
